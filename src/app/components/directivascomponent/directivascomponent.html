<h1>Directivas</h1>
<h2 style="color: blue">Tienes {{deportes.length}} deportes</h2>


@if (deportes.length > 5) {
    <p style="color:orange">Tienes mas de 5 deportes</p>
} @else {
    <p style="color: red">Tienes menos de 5 deportes</p>

}
@for (elemento of deportes; track elemento) {
    <p style="color: darkgreen">{{elemento}}</p>

}
