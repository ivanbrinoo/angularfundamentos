<h1>Numeros estilos components</h1>
<ul>
    @for (num of numeros; track num) {
        @if (num % 2 == 0) {
            <li style="color:green; font-weight:bold; font-size:20">{{num}}</li>
        }@else {
            <li style="color:red; font-weight:bold; font-size:20">{{num}}</li>
        }
    }
</ul>
